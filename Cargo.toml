[package]
name = "drift"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A calm, Zen-inspired web browser built on Servo"
license = "MPL-2.0"
repository = "https://github.com/xRookieFight/drift"
readme = "README.md"
keywords = ["browser", "servo", "web-browser"]
categories = ["gui"]
publish = false

[dependencies]
base64 = "0.22"
dirs = "7.0"
dpi = "0.1"
euclid = "0.22"
flate2 = "1.1"
glow = "0.17.0"
headers = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
log = "0.4"
mime_guess = "2.0.5"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
servo = { version = "0.8.0", features = ["brotli-compression-stream", "subtlecrypto", "webgl", "webgpu", "media-gstreamer"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "json", "gzip"] }
url = "2.5"
winit = "0.30.13"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick to relink, for running the browser while working on it.
# Servo is unusably slow in debug builds, and full LTO takes minutes per change.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
