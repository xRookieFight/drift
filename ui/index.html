<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <ul id="tabs"></ul>
    <button id="new-tab" class="wide"><span class="glyph"></span><span>New Tab</span></button>
  </aside>

  <header id="topbar">
    <button id="back" class="icon" title="Back (Alt+Left)"></button>
    <button id="forward" class="icon" title="Forward (Alt+Right)"></button>
    <button id="reload" class="icon" title="Reload (Ctrl+R)"></button>
    <form id="address-form" autocomplete="off">
      <input id="address" type="text" spellcheck="false" placeholder="Search or enter address">
    </form>
    <button id="split" class="icon" title="Split view (Ctrl+Shift+S)"></button>
    <div id="loading-bar"></div>
  </header>

  <div id="card"></div>
  <div id="focus-ring"></div>
  <div id="divider"><span></span></div>

  <div id="overlay" hidden>
    <div id="dialog"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
