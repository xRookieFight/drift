name: Feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, the solution second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
  - type: textarea
    id: elsewhere
    attributes:
      label: Other browsers
      description: Does another browser do this well? How?
