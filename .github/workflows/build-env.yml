name: Build env image

on:
  push:
    branches: [main]
    paths:
      - docker/build-env.Dockerfile
      - .github/workflows/build-env.yml
  schedule:
    # monthly refresh so Fedora security updates and new stable Rust land in the image
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-env
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/xrookiefight/drift-build-env

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/build-env.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
