name: Dependency audit

on:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
