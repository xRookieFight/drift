version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # servo pulls a huge tree, bump it by hand with the bump-servo skill
      cargo:
        patterns: ["*"]
        exclude-patterns: ["servo"]
    ignore:
      - dependency-name: servo
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
